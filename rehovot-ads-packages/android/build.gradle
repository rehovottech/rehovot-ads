ext {
    levelPlayVersion = rootProject.ext.has('levelPlayVersion') ? rootProject.ext.levelPlayVersion : '9.6.1'
    androidxAppCompatVersion = rootProject.ext.has('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply plugin: 'com.android.library'

android {
    namespace "com.rehovottech.capacitorads"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36

    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        consumerProguardFiles 'proguard-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // Unity LevelPlay mediation SDK. Keep in step with the IronSourceSDK pod in RehovottechCapacitorAds.podspec.
    // Network adapters (unityads-adapter, admob-adapter, ...) go in each game's app/build.gradle.
    implementation "com.unity3d.ads-mediation:mediation-sdk:$levelPlayVersion"
}
